# ============================================================
# Confidence-Gated Interleaved Reasoning - Benchmark Config
# ============================================================

# --- Model settings ---
model:
  # OpenAI-compatible API endpoint
  api_base: null  # null = default OpenAI, or "http://localhost:8000/v1"
  model_name: "gpt-5-mini"
  temperature: 0.0           # baseline temperature
  max_tokens: 1024           # max tokens per call

# --- Interleaved reasoning settings ---
interleaved:
  confidence_threshold: 0.7  # re-think if confidence < this
  max_retries: 2             # max re-think attempts per chunk
  retry_temperature: 0.3     # slightly higher temp for diversity on retry

  # Confidence calibration prompt (injected into system prompt)
  confidence_guide: |
    Confidence criteria:
    - 0.9+: Certain fact or directly verifiable by calculation
    - 0.7~0.9: High confidence but open to alternative interpretations
    - 0.5~0.7: Uncertain, multiple plausible answers exist
    - Below 0.5: Close to a guess
    If unsure, rate low. It is better to retry with low confidence than to be wrong with high confidence.

# --- Evaluation tasks ---
# lm-evaluation-harness task names
tasks:
  - gpqa_diamond_zeroshot
  # - gpqa_main_zeroshot
  # - mmlu
  # - arc_challenge
  # - hellaswag
  # - winogrande
  # - truthfulqa_mc2

# --- Evaluation settings ---
eval:
  num_fewshot: 0            # few-shot examples (0 = zero-shot)
  limit: null               # null = all samples, or int for quick test
  log_samples: true         # log per-sample results for analysis
  output_dir: "./results"   # output directory
